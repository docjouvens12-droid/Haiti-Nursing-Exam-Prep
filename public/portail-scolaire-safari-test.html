<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f4c81" />
  <title>Portail Scolaire Haïti — Test Safari</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#14213d}.top{background:#0f4c81;color:white;padding:26px 22px;font-size:24px;font-weight:800}.wrap{max-width:520px;margin:36px auto;padding:0 18px}.card{background:#fff;border:1px solid #dbe5ef;border-radius:20px;padding:24px;box-shadow:0 10px 28px rgba(20,33,61,.07)}h1{font-size:34px;margin:0 0 10px}.ok{margin:0 0 24px;color:#35627f;font-weight:700}.field{display:block;margin:16px 0 7px;font-weight:800}input{width:100%;padding:14px;border:1px solid #cbd7e3;border-radius:12px;font-size:17px;background:#fff}button{margin-top:18px;border:0;border-radius:12px;padding:14px 20px;background:#0f4c81;color:#fff;font-size:17px;font-weight:800}
  </style>
</head>
<body>
  <div class="top">Portail Scolaire Haïti</div>
  <main class="wrap">
    <section class="card">
      <h1>Connexion</h1>
      <p class="ok">Safari fonctionne correctement si vous voyez cette page.</p>
      <label class="field">Identifiant du personnel</label>
      <input autocomplete="username" />
      <label class="field">Mot de passe</label>
      <input type="password" autocomplete="current-password" />
      <button type="button">Se connecter</button>
    </section>
  </main>
</body>
</html>
