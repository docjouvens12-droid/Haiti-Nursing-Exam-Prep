<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f4c81" />
  <title>Portail Scolaire Haïti — Connexion Safari</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#14213d}.top{background:#0f4c81;color:white;padding:26px 22px;font-size:24px;font-weight:800}.wrap{max-width:520px;margin:36px auto;padding:0 18px}.card{background:#fff;border:1px solid #dbe5ef;border-radius:20px;padding:24px;box-shadow:0 10px 28px rgba(20,33,61,.07)}h1{font-size:34px;margin:0 0 10px}.sub{margin:0 0 24px;color:#66788a}.field{display:block;margin:16px 0 7px;font-weight:800}input{width:100%;padding:14px;border:1px solid #cbd7e3;border-radius:12px;font-size:17px;background:#fff}button{margin-top:18px;border:0;border-radius:12px;padding:14px 20px;background:#0f4c81;color:#fff;font-size:17px;font-weight:800}button:disabled{opacity:.6}.msg{margin-top:18px;padding:12px 14px;border-radius:10px;display:none}.msg.ok{display:block;background:#eaf8ef;color:#176b3a}.msg.err{display:block;background:#fff0f0;color:#9b1c1c}
  </style>
</head>
<body>
  <div class="top">Portail Scolaire Haïti</div>
  <main class="wrap">
    <section class="card">
      <h1>Connexion</h1>
      <p class="sub">Utilisez vos informations de connexion.</p>
      <form id="loginForm">
        <label class="field" for="identifier">Identifiant du personnel</label>
        <input id="identifier" name="identifier" autocomplete="username" required />
        <label class="field" for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button id="submitBtn" type="submit">Se connecter</button>
      </form>
      <div id="message" class="msg"></div>
    </section>
  </main>
<script>
const SUPABASE_URL='https://vncrujkndfpatwvxtchk.supabase.co';
const SUPABASE_KEY='sb_publishable_jfsR5S6Sqcf-9h16Mw3zvA_zZPUlfe2';
async function accessEmail(accessId){
  const data=new TextEncoder().encode(accessId.trim().toLowerCase());
  const digest=await crypto.subtle.digest('SHA-256',data);
  const hex=Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
  return `u-${hex.slice(0,32)}@access.portailscolaire.local`;
}
const form=document.getElementById('loginForm');
const button=document.getElementById('submitBtn');
const message=document.getElementById('message');
function show(text,type){message.textContent=text;message.className='msg '+type;}
form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  const identifier=document.getElementById('identifier').value.trim();
  const password=document.getElementById('password').value;
  if(!identifier||!password)return;
  button.disabled=true; button.textContent='Connexion...'; message.className='msg';
  try{
    const email=identifier.includes('@')?identifier:await accessEmail(identifier);
    const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},
      body:JSON.stringify({email,password})
    });
    const data=await r.json();
    if(!r.ok||!data.access_token){show("Identifiant d’accès ou mot de passe incorrect.",'err');return;}
    try{localStorage.setItem('sb-vncrujkndfpatwvxtchk-auth-token',JSON.stringify(data));}catch(_e){}
    show('Connexion réussie. Ouverture de votre espace...','ok');
    setTimeout(()=>{window.location.assign('/portail-scolaire');},700);
  }catch(err){show('Impossible de joindre le service de connexion. Réessayez.','err');}
  finally{button.disabled=false;button.textContent='Se connecter';}
});
</script>
</body>
</html>
