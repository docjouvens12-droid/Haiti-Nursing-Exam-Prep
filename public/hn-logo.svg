  <linearGradient id="cyan" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#65f5fb"/><stop offset=".5" stop-color="#10c8ee"/><stop offset="1" stop-color="#0384cc"/></linearGradient>
