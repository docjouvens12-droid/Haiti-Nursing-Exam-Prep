<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4c81">
<title>Portail Scolaire Haïti</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#14213d}.top{background:#0f4c81;color:#fff;padding:28px 22px;font-size:25px;font-weight:800}.wrap{max-width:560px;margin:34px auto;padding:0 18px}.card{background:#fff;border:1px solid #d8e3ec;border-radius:20px;padding:24px;box-shadow:0 10px 28px rgba(20,33,61,.07)}h1{font-size:34px;margin:0 0 12px}.sub{color:#68798a;margin:0 0 24px}.label{display:block;font-weight:800;margin:17px 0 7px}input{width:100%;font-size:18px;padding:15px;border:1px solid #cbd7e3;border-radius:12px;background:white}button{margin-top:18px;background:#0f5c91;color:#fff;border:0;border-radius:12px;padding:14px 22px;font-size:18px;font-weight:800}.msg{margin-top:18px;padding:14px;border-radius:12px;display:none}.ok{display:block;background:#e9f8ef;color:#176b3a}.err{display:block;background:#fff0f0;color:#9b1c1c}.info{display:block;background:#eef6fb;color:#174f73}.dash{display:none}.student{font-size:24px;font-weight:800;margin:0 0 8px}.muted{color:#68798a}.row{padding:10px 0;border-top:1px solid #e6edf3}.row:first-child{border-top:0}
</style>
</head>
<body>
<div class="top">Portail Scolaire Haïti</div>
<main class="wrap">
<section id="login" class="card">
<h1>Connexion</h1>
<p class="sub">Utilisez vos informations de connexion.</p>
<form id="form">
<label class="label" for="id">Identifiant du personnel</label>
<input id="id" autocomplete="username" required>
<label class="label" for="pw">Mot de passe</label>
<input id="pw" type="password" autocomplete="current-password" required>
<button id="btn" type="submit">Se connecter</button>
</form>
<div id="msg" class="msg"></div>
</section>
<section id="dash" class="card dash">
<h1>Tableau de bord de l’Élève</h1>
<p id="studentName" class="student">Élève</p>
<div id="studentClass" class="muted"></div>
<div id="studentYear" class="muted"></div>
<div id="details" style="margin-top:20px"></div>
<button id="logout" type="button">Déconnexion</button>
</section>
</main>
<script>
var SUPABASE_URL='https://vncrujkndfpatwvxtchk.supabase.co';
var SUPABASE_KEY='sb_publishable_jfsR5S6Sqcf-9h16Mw3zvA_zZPUlfe2';
function show(text,type){var m=document.getElementById('msg');m.textContent=text;m.className='msg '+type;}
async function makeEmail(accessId){var raw=new TextEncoder().encode(accessId.trim().toLowerCase());var digest=await crypto.subtle.digest('SHA-256',raw);var bytes=new Uint8Array(digest);var hex='';for(var i=0;i<bytes.length;i++){hex+=bytes[i].toString(16).padStart(2,'0');}return 'u-'+hex.slice(0,32)+'@access.portailscolaire.local';}
async function rest(path,token){var r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token}});var t=await r.text();if(!r.ok)throw new Error('Erreur données ('+r.status+')');return t?JSON.parse(t):[];}
async function loadStudent(auth){var token=auth.access_token;var userId=auth.user&&auth.user.id;if(!token||!userId)throw new Error('Session invalide.');var profiles=await rest('school_profiles?user_id=eq.'+encodeURIComponent(userId)+'&select=role,student_id',token);if(!profiles.length)throw new Error('Aucun profil scolaire lié à ce compte.');var p=profiles[0];if(p.role!=='student'||!p.student_id)throw new Error('Ce compte n’est pas lié à un élève.');var students=await rest('school_students?id=eq.'+encodeURIComponent(p.student_id)+'&select=id,name,level,section,academic_year',token);if(!students.length)throw new Error('Profil élève introuvable.');var s=students[0];document.getElementById('studentName').textContent=s.name||s.id;document.getElementById('studentClass').textContent=(s.level||'')+(s.section?' – Section '+s.section:'');document.getElementById('studentYear').textContent=s.academic_year||'';document.getElementById('details').innerHTML='<div class="row"><strong>Session:</strong> connectée</div><div class="row"><strong>Profil:</strong> élève</div>';document.getElementById('login').style.display='none';document.getElementById('dash').style.display='block';}
document.getElementById('form').addEventListener('submit',async function(e){e.preventDefault();var id=document.getElementById('id').value.trim();var pw=document.getElementById('pw').value;var btn=document.getElementById('btn');btn.disabled=true;btn.textContent='Connexion...';show('Vérification...','info');try{var email=id.indexOf('@')>=0?id:await makeEmail(id);var r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY},body:JSON.stringify({email:email,password:pw})});var data=await r.json();if(!r.ok||!data.access_token){throw new Error('Identifiant d’accès ou mot de passe incorrect.');}show('Connexion réussie. Chargement du profil...','ok');await loadStudent(data);}catch(err){show(err&&err.message?err.message:'Erreur de connexion.','err');}finally{btn.disabled=false;btn.textContent='Se connecter';}});
document.getElementById('logout').addEventListener('click',function(){document.getElementById('dash').style.display='none';document.getElementById('login').style.display='block';document.getElementById('pw').value='';document.getElementById('msg').className='msg';});
</script>
</body>
</html>
