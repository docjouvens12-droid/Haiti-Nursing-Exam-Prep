<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4c81">
<title>Portail Scolaire Haïti</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#14213d}.top{background:#0f4c81;color:#fff;padding:28px 22px;font-size:25px;font-weight:800}.wrap{max-width:620px;margin:34px auto;padding:0 18px}.card{background:#fff;border:1px solid #d8e3ec;border-radius:20px;padding:24px;box-shadow:0 10px 28px rgba(20,33,61,.07);margin-bottom:18px}h1{font-size:34px;margin:0 0 12px}h2{margin:0 0 14px}.sub{color:#68798a;margin:0 0 24px}.label{display:block;font-weight:800;margin:17px 0 7px}input,select{width:100%;font-size:18px;padding:15px;border:1px solid #cbd7e3;border-radius:12px;background:white}button{margin-top:18px;background:#0f5c91;color:#fff;border:0;border-radius:12px;padding:14px 22px;font-size:18px;font-weight:800}button:disabled{opacity:.6}.msg{margin-top:18px;padding:14px;border-radius:12px;display:none}.ok{display:block;background:#e9f8ef;color:#176b3a}.err{display:block;background:#fff0f0;color:#9b1c1c}.info{display:block;background:#eef6fb;color:#174f73}.dash{display:none}.student{font-size:24px;font-weight:800;margin:0 0 8px}.muted{color:#68798a}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.stat{background:#f7fafc;border:1px solid #dbe5ef;border-radius:14px;padding:16px}.value{font-size:28px;font-weight:900;color:#0f5c91}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}.grade{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid #e4edf4}.grade:first-child{border-top:0}.grade-score{font-weight:900;color:#0f5c91;white-space:nowrap}.bulletin{display:none}.bulletin.show{display:block}.general{margin-top:14px;border:2px solid #0f4c81;padding:13px 14px;border-radius:12px;display:flex;justify-content:space-between;gap:12px;font-weight:900}.secondary{background:#eef5fa;color:#0f4c81}.logout{width:100%}@media(max-width:430px){.stats,.toolbar{grid-template-columns:1fr}.wrap{padding:0 12px}.card{padding:20px}h1{font-size:31px}}
</style>
</head>
<body>
<div class="top">Portail Scolaire Haïti</div>
<main class="wrap">
<section id="login" class="card">
<h1>Connexion</h1>
<p class="sub">Utilisez vos informations de connexion.</p>
<form id="form">
<label class="label" for="id">Identifiant du personnel</label>
<input id="id" autocomplete="username" required>
<label class="label" for="pw">Mot de passe</label>
<input id="pw" type="password" autocomplete="current-password" required>
<button id="btn" type="submit">Se connecter</button>
</form>
<div id="msg" class="msg"></div>
</section>
<section id="dash" class="dash">
<div class="card">
<h1>Tableau de bord de l’Élève</h1>
<p id="studentName" class="student">Élève</p>
<div id="studentClass" class="muted"></div>
<div id="studentYear" class="muted"></div>
<div class="stats"><div class="stat"><div class="muted">Moyenne du trimestre</div><div id="trimAvg" class="value">—</div></div><div class="stat"><div class="muted">Moyenne générale</div><div id="generalAvg" class="value">—</div></div></div>
</div>
<div class="card"><h2>Choisir le résultat à afficher</h2><div class="toolbar"><div><label class="label" for="trimester">Trimestre</label><select id="trimester"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div><div><button id="bulletinBtn" class="secondary" type="button">Voir mon bulletin</button></div></div></div>
<div class="card"><h2>Notes publiées</h2><div id="gradesList" class="muted">Chargement...</div></div>
<div id="bulletin" class="card bulletin"><h2>Mon bulletin — Trimestre <span id="bulletinTrim">1</span></h2><div id="bulletinStudent" class="muted" style="margin-bottom:14px"></div><div id="bulletinRows"></div><div class="general"><span>Moyenne générale pondérée</span><span id="weightedAvg">—</span></div></div>
<div class="card"><button id="logout" class="logout" type="button">Déconnexion</button></div>
</section>
</main>
<script>
var SUPABASE_URL='https://vncrujkndfpatwvxtchk.supabase.co';
var SUPABASE_KEY='sb_publishable_jfsR5S6Sqcf-9h16Mw3zvA_zZPUlfe2';
var grades=[];var subjects=[];var student=null;
function show(text,type){var m=document.getElementById('msg');m.textContent=text;m.className='msg '+type;}
function norm(v){return String(v||'').trim().toLowerCase();}
function trimNo(term){var v=norm(term);if(['1er trimestre','1e trimestre','trimestre 1','trimès 1'].indexOf(v)>=0)return 1;if(['2e trimestre','trimestre 2','trimès 2'].indexOf(v)>=0)return 2;if(['3e trimestre','trimestre 3','trimès 3'].indexOf(v)>=0)return 3;var m=v.match(/[123]/);return m?Number(m[0]):0;}
function fmt(n){return Number.isFinite(n)?(Math.round(n*10)/10).toFixed(1)+'%':'—';}
function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
async function makeEmail(accessId){var raw=new TextEncoder().encode(accessId.trim().toLowerCase());var digest=await crypto.subtle.digest('SHA-256',raw);var bytes=new Uint8Array(digest);var hex='';for(var i=0;i<bytes.length;i++){hex+=bytes[i].toString(16).padStart(2,'0');}return 'u-'+hex.slice(0,32)+'@access.portailscolaire.local';}
async function rest(path,token){var r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token}});var t=await r.text();if(!r.ok)throw new Error('Erreur données ('+r.status+')');return t?JSON.parse(t):[];}
function coeffFor(name){for(var i=0;i<subjects.length;i++){if(norm(subjects[i].name)===norm(name))return Math.max(.01,Number(subjects[i].coefficient)||1);}return 1;}
function periodRows(n){var pg=grades.filter(function(g){return trimNo(g.term)===n});var names=[];pg.forEach(function(g){if(g.subject&&names.indexOf(g.subject)<0)names.push(g.subject)});return names.sort().map(function(name){var items=pg.filter(function(g){return g.subject===name});var avg=items.reduce(function(s,g){return s+Number(g.score||0)},0)/items.length;var c=coeffFor(name);return {name:name,avg:avg,coefficient:c,points:avg*c};});}
function simpleAverage(items){if(!items.length)return null;return items.reduce(function(s,g){return s+Number(g.score||0)},0)/items.length;}
function render(){var n=Number(document.getElementById('trimester').value)||1;var pg=grades.filter(function(g){return trimNo(g.term)===n});document.getElementById('trimAvg').textContent=pg.length?fmt(simpleAverage(pg)):'—';document.getElementById('generalAvg').textContent=grades.length?fmt(simpleAverage(grades)):'—';var list=document.getElementById('gradesList');if(!pg.length){list.textContent='Aucune note publiée pour ce trimestre.';}else{list.innerHTML=pg.slice().sort(function(a,b){return String(a.subject||'').localeCompare(String(b.subject||''))}).map(function(g){return '<div class="grade"><div><strong>'+esc(g.subject||'Matière')+'</strong><div class="muted">'+esc(g.term||('Trimestre '+n))+'</div></div><div class="grade-score">'+fmt(Number(g.score||0))+'</div></div>';}).join('');}var rows=periodRows(n);document.getElementById('bulletinTrim').textContent=String(n);document.getElementById('bulletinStudent').textContent=(student?student.name:'')+' • '+(student?student.level:'')+(student&&student.section?' – Section '+student.section:'')+' • '+(student?student.academic_year:'');var br=document.getElementById('bulletinRows');if(!rows.length){br.innerHTML='<div class="muted">Aucun résultat publié pour ce trimestre.</div>';document.getElementById('weightedAvg').textContent='—';}else{br.innerHTML=rows.map(function(r){return '<div class="grade"><div><strong>'+esc(r.name)+'</strong><div class="muted">Coefficient '+String(r.coefficient)+'</div></div><div class="grade-score">'+fmt(r.avg)+'</div></div>';}).join('');var tc=rows.reduce(function(s,r){return s+r.coefficient},0);var w=tc?rows.reduce(function(s,r){return s+r.points},0)/tc:null;document.getElementById('weightedAvg').textContent=w===null?'—':fmt(w);}}
async function loadStudent(auth){var token=auth.access_token;var userId=auth.user&&auth.user.id;if(!token||!userId)throw new Error('Session invalide.');var profiles=await rest('school_profiles?user_id=eq.'+encodeURIComponent(userId)+'&select=role,student_id',token);if(!profiles.length)throw new Error('Aucun profil scolaire lié à ce compte.');var p=profiles[0];if(p.role!=='student'||!p.student_id)throw new Error('Ce compte n’est pas lié à un élève.');var students=await rest('school_students?id=eq.'+encodeURIComponent(p.student_id)+'&select=id,name,level,section,academic_year',token);if(!students.length)throw new Error('Profil élève introuvable.');student=students[0];grades=await rest('school_grades?student_id=eq.'+encodeURIComponent(p.student_id)+'&status=eq.approved&published=eq.true&select=score,term,subject',token);try{subjects=await rest('school_subjects?select=name,coefficient&order=name.asc',token);}catch(e){subjects=[];}document.getElementById('studentName').textContent=student.name||student.id;document.getElementById('studentClass').textContent=(student.level||'')+(student.section?' – Section '+student.section:'');document.getElementById('studentYear').textContent=student.academic_year||'';render();document.getElementById('login').style.display='none';document.getElementById('dash').style.display='block';}
document.getElementById('form').addEventListener('submit',async function(e){e.preventDefault();var id=document.getElementById('id').value.trim();var pw=document.getElementById('pw').value;var btn=document.getElementById('btn');btn.disabled=true;btn.textContent='Connexion...';show('Vérification...','info');try{var email=id.indexOf('@')>=0?id:await makeEmail(id);var r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY},body:JSON.stringify({email:email,password:pw})});var data=await r.json();if(!r.ok||!data.access_token)throw new Error('Identifiant d’accès ou mot de passe incorrect.');show('Connexion réussie. Chargement du tableau de bord...','ok');await loadStudent(data);}catch(err){show(err&&err.message?err.message:'Erreur de connexion.','err');}finally{btn.disabled=false;btn.textContent='Se connecter';}});
document.getElementById('trimester').addEventListener('change',render);
document.getElementById('bulletinBtn').addEventListener('click',function(){var b=document.getElementById('bulletin');b.classList.toggle('show');this.textContent=b.classList.contains('show')?'Masquer mon bulletin':'Voir mon bulletin';});
document.getElementById('logout').addEventListener('click',function(){grades=[];subjects=[];student=null;document.getElementById('dash').style.display='none';document.getElementById('login').style.display='block';document.getElementById('pw').value='';document.getElementById('msg').className='msg';document.getElementById('bulletin').classList.remove('show');document.getElementById('bulletinBtn').textContent='Voir mon bulletin';});
</script>
</body>
</html>
