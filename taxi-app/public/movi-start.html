<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f705a" />
  <title>MOVI</title>
  <style>
    html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#0f705a 0 18%,#eff7f4 18% 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#102033}
    body{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .card{width:min(100%,420px);background:#fff;border-radius:30px;padding:28px;box-sizing:border-box;box-shadow:0 28px 70px rgba(0,0,0,.18);text-align:center}
    .logo{width:96px;height:96px;margin:0 auto 14px;border-radius:28px;background:linear-gradient(145deg,#16a06e,#08784f);display:grid;place-items:center;color:white;font-weight:900;font-size:44px;box-shadow:0 12px 28px rgba(15,112,90,.28)}
    h1{margin:0;font-size:34px;letter-spacing:-.03em}.tag{margin:6px 0 22px;color:#6d7d77;font-size:15px}
    button{width:100%;border:0;border-radius:16px;padding:16px;background:#0f705a;color:#fff;font-size:17px;font-weight:800;box-shadow:0 12px 26px rgba(15,112,90,.22)}
    small{display:block;margin-top:14px;color:#83918c}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">M</div>
    <h1>MOVI</h1>
    <p class="tag">Mouvman pou yon pi bon demen</p>
    <button id="open">Ouvri MOVI</button>
    <small>App la pare.</small>
  </main>
  <script>
    document.getElementById('open').addEventListener('click', function () {
      location.href = '/movi-app-v2?from=pwa-start-v3';
    });
  </script>
</body>
</html>
