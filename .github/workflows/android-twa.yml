name: Build Android TWA

on:
  push:
    branches: [main]
    paths:
      - "android/twa-manifest.json"
      - ".github/workflows/android-twa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Prepare Android SDK for Bubblewrap
        run: |
          test -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          ln -sfn "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" "$ANDROID_SDK_ROOT/bin"
          ls -la "$ANDROID_SDK_ROOT/bin/sdkmanager"

      - name: Write Bubblewrap config
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF
          bubblewrap doctor

      - name: Generate Android project
        working-directory: android
        env:
          CI: "true"
        run: bubblewrap update --skipVersionUpgrade --manifest ./twa-manifest.json

      - name: Restore Android upload keystore
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android.keystore
          test -s android.keystore
          chmod 600 android.keystore

      - name: Build signed Android bundle
        working-directory: android
        env:
          CI: "true"
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation --manifest ./twa-manifest.json

      - name: Verify signed bundle
        working-directory: android
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab >/dev/null
          echo "Android App Bundle signature verified."

      - name: Package generated Android source
        working-directory: android
        run: |
          zip -r haiti-nursing-android-source.zip . \
            -x "app/build/*" \
            -x ".gradle/*" \
            -x "*.keystore" \
            -x "*.jks"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haiti-nursing-android-signed
          if-no-files-found: error
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/haiti-nursing-android-source.zip
          retention-days: 14
